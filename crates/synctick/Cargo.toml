[package]
name = "synctick"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
repository.workspace = true
description = "Deterministic server-sequenced multiplayer sessions, recording, and replay for Rust games"
readme = "README.md"
documentation = "https://docs.rs/synctick"
keywords = ["gamedev", "multiplayer", "deterministic", "networking"]
categories = ["game-development", "network-programming"]

[dependencies]
synctick-derive = { path = "../synctick-derive", version = "=0.1.0" }
log = "0.4"
arc-swap = "1"
crossbeam-channel = "0.5"
renet.workspace = true
renet_netcode.workspace = true
bincode.workspace = true
serde.workspace = true
thiserror = "2"
[dev-dependencies]
# Inspect Renet packet headers in loss/reordering regression tests.
octets = "0.3"
tempfile = "3"

[lints]
workspace = true
