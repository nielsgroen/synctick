name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Aliased dependency consumer
        run: cargo test --manifest-path tests/fixtures/renamed-dependency/Cargo.toml --locked
      - name: Formatting
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path tests/fixtures/renamed-dependency/Cargo.toml --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path tests/fixtures/renamed-dependency/Cargo.toml --all-targets --locked -- -D warnings
      - name: Rustdoc
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
