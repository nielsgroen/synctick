name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_checks:
        description: Run Rustdoc, MSRV, and package verification before publishing
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Keep Bevy artifacts small on hosted runners; local profiles are unchanged.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Tests and quality checks (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not restore the previous, debug-heavy build caches.
          prefix-key: synctick-ci-lean-v1
      - name: Formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path tests/fixtures/renamed-dependency/Cargo.toml --check
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Aliased dependency consumer
        run: cargo test --manifest-path tests/fixtures/renamed-dependency/Cargo.toml --locked
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path tests/fixtures/renamed-dependency/Cargo.toml --all-targets --locked -- -D warnings
      # Run these explicitly via Actions > CI > Run workflow before a release.
      - name: Rustdoc
        if: inputs.release_checks
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Free build space before release checks
        if: inputs.release_checks
        run: |
          cargo clean
          cargo clean --manifest-path tests/fixtures/renamed-dependency/Cargo.toml
      - name: Install minimum supported Rust
        if: inputs.release_checks
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Libraries on Rust 1.92
        if: inputs.release_checks
        run: cargo +1.92.0 check -p synctick -p synctick-bevy -p synctick-derive --all-targets --locked
      - name: Verify publishable archives
        if: inputs.release_checks
        run: |
          cargo clean
          cargo package -p synctick-derive -p synctick -p synctick-bevy
