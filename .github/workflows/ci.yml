name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Keep Bevy artifacts small on hosted runners; local profiles are unchanged.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Tests and quality checks (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not restore the previous, debug-heavy build caches.
          prefix-key: synctick-ci-lean-v1
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Aliased dependency consumer
        run: cargo test --manifest-path tests/fixtures/renamed-dependency/Cargo.toml --locked
      - name: Formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path tests/fixtures/renamed-dependency/Cargo.toml --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path tests/fixtures/renamed-dependency/Cargo.toml --all-targets --locked -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  package:
    name: Verify publishable archives
    runs-on: ubuntu-latest
    # Verify on a fresh runner, without the graphical example's build artifacts.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package -p synctick-derive -p synctick -p synctick-bevy

  msrv:
    name: Libraries on Rust 1.92
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not restore the previous, debug-heavy build caches.
          prefix-key: synctick-ci-lean-v1
      - run: cargo check -p synctick -p synctick-bevy -p synctick-derive --all-targets --locked
